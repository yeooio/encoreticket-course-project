# 独立配置入口：不加载 application.yaml，不导入 .env。
spring.application.name=encore-ticket-http-e2e
spring.profiles.active=test
server.address=127.0.0.1
server.port=0
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.create-schemas=false
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
encore.payment.simulation.enabled=true
encore.movie.publication-scheduler.enabled=false
encore.screening.lifecycle-scheduler.enabled=false
encore.order.expiration-scheduler.enabled=false
# 退款自动执行属于本次 E2E，不替换为直接调用 Service。
encore.refund.scheduler-enabled=true
encore.refund.processing-delay-ms=100
encore.refund.cleanup-delay-ms=3600000
encore.order.cleanup-delay-ms=3600000
encore.payment.cleanup-delay-ms=3600000
encore.ticket-verification.cleanup-delay-ms=3600000
