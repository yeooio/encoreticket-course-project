<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#222;font-size:24px}.title{font-weight:bold;font-size:28px}.label{font-size:21px}.shape{fill:white;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:#222}</style><text x="620" y="45" text-anchor="middle" class="title">购票业务流程</text><ellipse cx="620" cy="105" rx="110" ry="35" class="shape"/><text x="620" y="113" text-anchor="middle">开始</text><rect x="455" y="175" width="330" height="64" class="shape"/><text x="620" y="216" text-anchor="middle">浏览影片与场次</text><rect x="455" y="285" width="330" height="64" class="shape"/><text x="620" y="326" text-anchor="middle">登录并选择座位</text><polygon points="620,395 770,460 620,525 470,460" class="shape"/><text x="620" y="468" text-anchor="middle">座位可售？</text><rect x="455" y="575" width="330" height="64" class="shape"/><text x="620" y="616" text-anchor="middle">创建订单并占座</text><rect x="455" y="685" width="330" height="64" class="shape"/><text x="620" y="726" text-anchor="middle">发起模拟支付</text><polygon points="620,795 770,860 620,925 470,860" class="shape"/><text x="620" y="868" text-anchor="middle">支付确认成功？</text><rect x="455" y="975" width="330" height="64" class="shape"/><text x="620" y="1016" text-anchor="middle">结算并生成票券</text><rect x="455" y="1085" width="330" height="64" class="shape"/><text x="620" y="1126" text-anchor="middle">用户查询票券</text><ellipse cx="620" cy="1230" rx="110" ry="35" class="shape"/><text x="620" y="1238" text-anchor="middle">结束</text><rect x="75" y="428" width="230" height="64" class="shape"/><text x="190" y="469" text-anchor="middle">重新选择座位</text><rect x="75" y="828" width="230" height="64" class="shape"/><text x="190" y="869" text-anchor="middle">查询当前支付结果</text><path class="line" d="M620 140 V165 M620 239 V275 M620 349 V385 M620 525 V565 M620 639 V675 M620 749 V785 M620 925 V965 M620 1039 V1075 M620 1149 V1185 M470 460 H315 M190 428 V317